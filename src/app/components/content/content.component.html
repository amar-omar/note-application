<div
  id="content" class="min-h-[calc(100vh-64px)] bg-gradient-to-br from-purple-100 via-white to-purple-300 px-6 sm:px-10 lg:px-16 flex items-center overview-x-hidden"
>
  <div
    class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center"
  >
    <!-- Content -->
    <div class="text-center lg:text-left">
      <!-- Main Heading -->
      <h1
        class="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight"
      >
        Organize Your
        <br />
        <span class="text-purple-600">Thoughts.</span>
      </h1>

      <!-- Second Heading -->
      <h2 class="mt-3 text-3xl sm:text-4xl lg:text-5xl font-bold text-gray-800">
        Keep Your
        <span class="text-purple-600"> Ideas. </span>
      </h2>

      <!-- Description -->
      <p
        class="mt-6 max-w-xl mx-auto lg:mx-0 text-lg sm:text-xl leading-relaxed text-gray-600"
      >
        Create, manage and organize your notes in one simple and beautiful
        place. Keep your ideas organized and access them whenever you need.
      </p>

      <!-- Buttons -->
      <div
        class="mt-8 flex flex-col sm:flex-row items-center lg:justify-start justify-center gap-4"
      >
        <!-- Get Started -->
<button
  (click)="onGetStarted()"
  class="group flex items-center justify-center gap-3 cursor-pointer rounded-xl bg-purple-600 px-7 py-3.5 font-bold text-white shadow-lg shadow-purple-200 transition-all duration-300 hover:-translate-y-1 hover:bg-purple-700 hover:shadow-xl hover:shadow-purple-300"
>
  Get Started

  <i
    class="fa-solid fa-arrow-right transition-transform duration-300 group-hover:translate-x-1"
  ></i>
</button>

        <!-- Learn More -->
      </div>

      <!-- Small Features -->
      <div
        class="mt-8 flex flex-wrap justify-center lg:justify-start gap-x-6 gap-y-3 text-sm text-gray-500"
      >
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-circle-check text-purple-600"></i>
          Easy to use
        </span>

        <span class="flex items-center gap-2">
          <i class="fa-solid fa-circle-check text-purple-600"></i>
          Organized notes
        </span>
      </div>
    </div>

    <!-- Image -->
    <div class="relative flex justify-center">
      <!-- Decorative blur -->
      <div
        class="absolute w-72 h-72 bg-purple-400/30 rounded-full blur-3xl"
      ></div>

      <!-- Image Card -->
      <div
        class="relative w-full max-w-lg rounded-3xl border border-white/60 bg-white/40 p-4 shadow-2xl shadow-purple-200/60 backdrop-blur-sm transition-transform duration-500 hover:-translate-y-2"
      >
        <img
          src="assets/content.jpeg"
          alt="NoteFlow notes"
          class="w-full rounded-2xl object-cover shadow-lg"
        />
      </div>
    </div>
  </div>
  
</div>
