<div class="container my-4 ">
  <button
    type="button"
    class="btn btn-primary shadow-lg px-4 py-2 rounded-xl"
    data-bs-toggle="modal"
    data-bs-target="#exampleModal"
    data-bs-whatever="@mdo"
  >
    <i class="fa-solid fa-plus"></i> Add Note
  </button>
</div>

@if (notesList.length > 0) {
  <div class="container">
<input [(ngModel)]="searchTermInput" type="search" class="form-control shadow mb-3" placeholder="Search by title..."/>

    <div class="row">
      @for (note of notesList |search:searchTermInput; track note._id) {
        <div class="col-md-4 py-3">
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title fw-bold">
                {{ note.title }}
              </h5>

              <p class="card-text">
                {{ note.content }}
              </p>

              <div class="mt-auto d-flex gap-2">
                <button
                  type="button"
                  class="btn btn-warning shadow-sm"
                  data-bs-toggle="modal"
                  data-bs-target="#updateNote"
                  (click)="updateNote(note, note._id)"
                >
                  <i class="fa-solid fa-pencil"></i>
                  Update
                </button>

                <button
                  (click)="deleteUserNote(note._id)"
                  type="button"
                  class="btn btn-danger shadow-sm"
                >
                  <i class="fa-solid fa-trash"></i>
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
} @else {
  <div class="container text-center py-5">
    <i class="fa-solid fa-note-sticky fa-3x text-secondary mb-3"></i>

    <h3>No Notes Found</h3>

    <p class="text-muted">You don't have any notes yet.</p>

    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal"
    >
      <i class="fa-solid fa-plus"></i>
      Add Your First Note
    </button>
  </div>
}
<div
  class="modal fade"
  id="exampleModal"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">New Note</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="addNoteForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">Title:</label>
            <input
              type="text"
              class="form-control"
              id="title"
              formControlName="title"
            />
          </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label">Content:</label>
            <textarea
              class="form-control"
              id="Content"
              formControlName="content"
            ></textarea>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" (click)="onSubmit()">
              Add Note
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<div
  class="modal fade"
  id="updateNote"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">update Note</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="updateNoteForm" (ngSubmit)="updateNoteForms()">
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">Title:</label>
            <input
              type="text"
              class="form-control"
              id="title"
              formControlName="title"
            />
          </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label">Content:</label>
            <textarea
              class="form-control"
              id="Content"
              formControlName="content"
            ></textarea>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-warning">update</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
