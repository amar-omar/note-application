<nav
  class="bg-gradient-to-r from-purple-100 via-white to-purple-200
         border-b border-purple-100 shadow-sm"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a
        routerLink="/"
        class="flex items-center gap-2 text-xl font-bold
               text-gray-800 hover:text-purple-600
               transition-colors"
      >
        <img
          src="assets/logo.png"
          class="w-[30px] h-[30px] object-contain rounded-xl"
          alt="NoteFlow logo"
        />

        <span>NoteFlow</span>
      </a>


      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-8">

        <!-- Home -->
        <a
          routerLink="/"
          routerLinkActive="text-purple-600"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-gray-600 hover:text-purple-600
                 font-medium transition-colors duration-200"
        >
          Home
        </a>


        <!-- Login -->
        <a
          routerLink="/login"
          routerLinkActive="text-purple-600"
          class="text-gray-600 hover:text-purple-600
                 font-medium transition-colors duration-200"
        >
          Login
        </a>


        <!-- Register -->
        <a
          routerLink="/register"
          routerLinkActive="text-purple-600"
          class="px-5 py-2 rounded-lg
                 bg-purple-600 text-white
                 font-medium
                 hover:bg-purple-700
                 transition-all duration-200
                 shadow-sm hover:shadow-md"
        >
          Register
        </a>


        <!-- Logout -->
        <button
          type="button"
          (click)="logOut()"
          class="flex items-center gap-2
                 rounded-xl
                 bg-red-400
                 px-4 py-2
                 font-medium
                 text-gray-900
                 hover:bg-red-500
                 hover:text-white
                 transition-all duration-300
                 shadow-sm"
        >
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </button>

      </div>


      <!-- Mobile Button -->
      <button
        type="button"
        class="md:hidden p-2 rounded-lg overflow-x-hidden
               text-gray-600
               hover:bg-purple-100
               hover:text-purple-600
               transition"
        (click)="isMenuOpen = !isMenuOpen"
        aria-label="Toggle navigation"
      >
        <i
          class="fa-solid"
          [class.fa-bars]="!isMenuOpen"
          [class.fa-xmark]="isMenuOpen"
        ></i>
      </button>

    </div>


    <!-- Mobile Navigation -->
    @if (isMenuOpen) {

      <div class="md:hidden border-t border-purple-100 py-4">

        <div class="flex flex-col gap-2">

          <a
            routerLink="/"
            (click)="isMenuOpen = false"
            class="px-4 py-3 rounded-lg
                   text-gray-600
                   hover:bg-purple-50
                   hover:text-purple-600
                   transition"
          >
            Home
          </a>


          <a
            routerLink="/login"
            (click)="isMenuOpen = false"
            class="px-4 py-3 rounded-lg
                   text-gray-600
                   hover:bg-purple-50
                   hover:text-purple-600
                   transition"
          >
            Login
          </a>


          <a
            routerLink="/register"
            (click)="isMenuOpen = false"
            class="px-4 py-3 rounded-lg
                   bg-purple-600
                   text-white
                   hover:bg-purple-700
                   transition"
          >
            Register
          </a>


          <button
            type="button"
            (click)="logOut(); isMenuOpen = false"
            class="flex items-center gap-2
                   px-4 py-3 rounded-lg
                   text-left
                   text-gray-600
                   hover:bg-red-50
                   hover:text-red-500
                   transition"
          >
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
          </button>

        </div>

      </div>

    }

  </div>
</nav>
